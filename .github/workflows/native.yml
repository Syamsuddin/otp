# SPDX-License-Identifier: GPL-3.0-only
name: native

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
            extra-apt: libx11-dev libxkbcommon-dev libwayland-dev
          - os: macos-15-intel
            label: macos-x64
          - os: macos-14
            label: macos-arm64
          - os: windows-2022
            label: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1

      - name: Linux X11 headers
        if: matrix.extra-apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.extra-apt }}

      # otpc links Pascal programs with clang on Windows; clang needs the MSVC
      # library environment that an "x64 Native Tools" shell would provide.
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Git Bash puts its coreutils `link` (usr/bin/link.exe) ahead of MSVC's
      # link.exe on PATH, and rustc trusts PATH once VCINSTALLDIR is set.
      - name: Pin MSVC linker for rustc
        if: runner.os == 'Windows'
        run: |
          dir="${VCToolsInstallDir%\\}"
          linker="$dir\\bin\\Hostx64\\x64\\link.exe"
          test -f "$(cygpath -u "$linker")" || { echo "::error::MSVC link.exe not found at $linker"; exit 1; }
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Toolchain info
        run: |
          mkdir -p ci-logs
          {
            rustc -vV
            cargo -V
            python --version
            clang --version 2>&1 | head -n 1 || echo "clang: not found"
            cc --version 2>&1 | head -n 1 || echo "cc: not found"
            git config --get core.autocrlf || echo "core.autocrlf: unset"
          } 2>&1 | tee ci-logs/0-toolchain.log
          echo "::notice title=${{ matrix.label }} toolchain::$(tr -d '\r' < ci-logs/0-toolchain.log | awk '{printf "%s%%0A", $0}')"

      - name: cargo build (release, offline, vendored)
        run: cargo build --workspace --release --locked --offline 2>&1 | tee ci-logs/1-build.log

      - name: cargo test (release, offline, vendored)
        run: cargo test --workspace --release --locked --offline 2>&1 | tee ci-logs/2-test.log

      - name: Native suite (release)
        run: python tests/native_suite.py --release 2>&1 | tee ci-logs/3-native-suite.log

      - name: Package host artifact
        run: python scripts/package.py --skip-build 2>&1 | tee ci-logs/4-package.log

      # Job logs require an authenticated API call; annotations are public, so
      # surface the tail of the failing step there for remote diagnosis.
      - name: Report failure tail
        if: failure()
        run: |
          f=$(ls ci-logs/*.log 2>/dev/null | sort | tail -n 1)
          [ -n "$f" ] || exit 0
          body=$(tail -n 60 "$f" | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=${{ matrix.label }} $(basename "$f")::$body"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTP-${{ matrix.label }}
          path: |
            dist/OTP-*-${{ matrix.label }}.*
            !dist/OTP-*-${{ matrix.label }}
          if-no-files-found: warn
