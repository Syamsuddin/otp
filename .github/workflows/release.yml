# SPDX-License-Identifier: GPL-3.0-only
# Push a tag vX.Y.Z[-pre] that equals the Cargo workspace version to build all
# four hosts, attach the archives and npm tarballs to a GitHub Release, and
# publish to npm when the NPM_TOKEN secret is configured.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/native.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_DIST_TAG: ${{ vars.NPM_DIST_TAG || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Tag must equal the workspace version
        run: |
          mkdir -p rel-logs
          version=$(python3 scripts/npm_pack.py version)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack launcher package
        run: python3 scripts/npm_pack.py main --out artifacts/npm-main

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a rel-logs/1-gh-release.log) 2>&1
          files=(artifacts/OTP-*/* artifacts/npm-*/*.tgz)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            flags=(); case "$VERSION" in *-*) flags+=(--prerelease);; esac
            gh release create "$GITHUB_REF_NAME" "${files[@]}" "${flags[@]}" \
              --title "ODIN Turbo Pascal $VERSION" --notes-file release-notes.md
          fi

      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          exec > >(tee -a rel-logs/2-npm-publish.log) 2>&1
          publish() {
            name=$(tar -xOzf "$1" package/package.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
              return
            fi
            npm publish "$1" --access public --tag "$NPM_DIST_TAG" --provenance
          }
          # Platform packages first so the launcher's optionalDependencies resolve on install.
          for f in artifacts/npm-*-*/*.tgz; do publish "$f"; done
          publish artifacts/npm-main/*.tgz

      - name: npm publish skipped
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::warning::NPM_TOKEN secret is not set; npm tarballs are attached to the GitHub Release but were not published."

      - name: Report failure tail
        if: failure()
        run: |
          f=$(ls rel-logs/*.log 2>/dev/null | sort | tail -n 1)
          [ -n "$f" ] || exit 0
          body=$(tail -n 40 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=release $(basename "$f")::$body"
